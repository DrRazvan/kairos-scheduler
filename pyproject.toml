[project]
name = "kairos-scheduler"
version = "0.0.1"
description = "A custom Kubernetes scheduler in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kubernetes>=37.0.1",
]

[project.scripts]
kairos = "kairos.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kairos"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
packages = ["kairos"]
mypy_path = "src"
# watch/config helpers in the kubernetes client are not annotated
untyped_calls_exclude = ["kubernetes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
