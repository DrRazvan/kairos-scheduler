# A pod that asks for OUR scheduler. Until Kairos is running it stays Pending.
# Phase 0 exercise: bind it by hand via the API (see docs/PLAN.md).
apiVersion: v1
kind: Pod
metadata:
  name: kairos-hello
  labels:
    app: kairos-hello
spec:
  schedulerName: kairos-scheduler
  containers:
    - name: hello
      image: busybox:1.36
      command: ["sh", "-c", "echo scheduled by kairos on $NODE_NAME; sleep 3600"]
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
